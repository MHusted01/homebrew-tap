name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  casks:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Style
        run: brew style --casks mhusted01/tap

      - name: Audit
        run: brew audit --cask --online --tap=mhusted01/tap

      - name: Install, check and uninstall
        run: |
          brew install --cask mhusted01/tap/shortcutlens
          test -d /Applications/ShortcutLens.app
          codesign --verify --deep /Applications/ShortcutLens.app
          brew uninstall --cask --zap mhusted01/tap/shortcutlens
          test ! -e /Applications/ShortcutLens.app

  formulae:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find formulae
        id: formulae
        run: |
          if compgen -G "$(brew --repository mhusted01/tap)/Formula/*.rb" >/dev/null; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Style
        if: steps.formulae.outputs.present == 'true'
        run: brew style --formulae mhusted01/tap

      - name: Audit
        if: steps.formulae.outputs.present == 'true'
        run: brew audit --formula --online --tap=mhusted01/tap

      - name: Install, test and uninstall
        if: steps.formulae.outputs.present == 'true'
        run: |
          brew install mhusted01/tap/reachmap
          brew test mhusted01/tap/reachmap
          reachmap --version
          brew uninstall mhusted01/tap/reachmap
