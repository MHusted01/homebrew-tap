name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  casks:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Style
        run: brew style --casks mhusted01/tap

      - name: Audit
        run: brew audit --cask --online --tap=mhusted01/tap

      - name: Install, check and uninstall
        run: |
          brew install --cask mhusted01/tap/shortcutlens
          test -d /Applications/ShortcutLens.app
          codesign --verify --deep /Applications/ShortcutLens.app
          brew uninstall --cask --zap mhusted01/tap/shortcutlens
          test ! -e /Applications/ShortcutLens.app
